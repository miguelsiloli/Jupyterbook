<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Enhanced Workflow with Proactive Monitoring</text>
  
  <!-- Clients -->
  <rect x="50" y="80" width="180" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
  <text x="140" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2" text-anchor="middle">CLIENTS</text>
  <text x="140" y="125" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Create tickets</text>
  <text x="140" y="140" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Approve budgets</text>
  <text x="140" y="155" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• See proactive value</text>
  
  <!-- Project Managers -->
  <rect x="320" y="80" width="180" height="80" fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="10"/>
  <text x="410" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00" text-anchor="middle">PROJECT MANAGERS</text>
  <text x="410" y="125" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Prioritize tickets</text>
  <text x="410" y="140" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Hold monitoring tickets</text>
  <text x="410" y="155" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Push for solutions</text>
  
  <!-- Developers -->
  <rect x="590" y="80" width="180" height="80" fill="#e8f5e8" stroke="#4caf50" stroke-width="3" rx="10"/>
  <text x="680" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4caf50" text-anchor="middle">DEVELOPERS</text>
  <text x="680" y="125" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Implement solutions</text>
  <text x="680" y="140" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Use performance data</text>
  <text x="680" y="155" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Deploy improvements</text>
  
  <!-- Support -->
  <rect x="860" y="80" width="180" height="80" fill="#ffebee" stroke="#d32f2f" stroke-width="3" rx="10"/>
  <text x="950" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d32f2f" text-anchor="middle">SUPPORT (24/7)</text>
  <text x="950" y="125" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Receive pagers</text>
  <text x="950" y="140" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Handle incidents</text>
  <text x="950" y="155" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">• Create tickets</text>
  
  <!-- Monitoring System (Central) -->
  <rect x="400" y="250" width="400" height="100" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4" rx="15"/>
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7b1fa2" text-anchor="middle">MONITORING SYSTEM</text>
  
  <!-- Low Priority Alerts -->
  <rect x="420" y="300" width="160" height="40" fill="#ff9800" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="500" y="315" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">LOW PRIORITY</text>
  <text x="500" y="330" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Tickets → Queue</text>
  
  <!-- High Priority Alerts -->
  <rect x="620" y="300" width="160" height="40" fill="#f44336" stroke="#d32f2f" stroke-width="2" rx="5"/>
  <text x="700" y="315" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">HIGH PRIORITY</text>
  <text x="700" y="330" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Pagers → Support</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f44336"/>
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
    </marker>
  </defs>
  
  <!-- Normal workflow arrows -->
  <line x1="230" y1="120" x2="320" y2="120" stroke="#666" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="500" y1="120" x2="590" y2="120" stroke="#666" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="770" y1="120" x2="860" y2="120" stroke="#666" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Labels for normal workflow -->
  <text x="275" y="110" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">tickets</text>
  <text x="545" y="110" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">tasks</text>
  <text x="815" y="110" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">deploy</text>
  
  <!-- Monitoring integration arrows -->
  <!-- Low priority to PM queue -->
  <line x1="500" y1="300" x2="450" y2="180" stroke="#ff9800" stroke-width="3" marker-end="url(#orangeArrow)"/>
  <text x="440" y="220" font-family="Arial, sans-serif" font-size="11" fill="#ff9800" font-weight="bold">TICKETS</text>
  
  <!-- High priority to Support -->
  <line x1="700" y1="300" x2="920" y2="180" stroke="#f44336" stroke-width="3" marker-end="url(#redArrow)"/>
  <text x="770" y="220" font-family="Arial, sans-serif" font-size="11" fill="#f44336" font-weight="bold">PAGERS</text>
  
  <!-- Support feedback loop -->
  <path d="M 950 160 Q 1100 200 1100 280 Q 1100 320 950 320 Q 800 320 780 310" stroke="#d32f2f" stroke-width="2" fill="none" marker-end="url(#redArrow)" stroke-dasharray="5,5"/>
  <text x="1050" y="240" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">creates tickets</text>
</svg>