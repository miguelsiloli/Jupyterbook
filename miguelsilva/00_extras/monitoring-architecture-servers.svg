<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Private Network Container -->
  <rect x="20" y="20" width="1360" height="860" fill="#f5f5f5" stroke="#666" stroke-width="3" rx="15" stroke-dasharray="10,5"/>
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#666">Private Network - Windows VMs</text>
  
  <!-- Central Orchestrator VM -->
  <rect x="450" y="80" width="400" height="180" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
  <text x="460" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">Central Orchestrator VM (Linux)</text>
  
  <!-- Prometheus inside Central VM -->
  <rect x="470" y="120" width="160" height="60" fill="#e91e63" stroke="#ad1457" stroke-width="2" rx="5"/>
  <text x="480" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Prometheus</text>
  <text x="480" y="160" font-family="Arial, sans-serif" font-size="11" fill="white">Port 9090</text>
  
  <!-- Grafana inside Central VM -->
  <rect x="650" y="120" width="160" height="60" fill="#ff9800" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="660" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Grafana</text>
  <text x="660" y="160" font-family="Arial, sans-serif" font-size="11" fill="white">Port 3000</text>
  
  <!-- External Access -->
  <rect x="50" y="300" width="250" height="60" fill="#e8f4fd" stroke="#2196F3" stroke-width="2" rx="5"/>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold">User Session</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="11">(VPN/SSH Tunnel)</text>
  
  <!-- SQL Server VM 1 -->
  <rect x="50" y="480" width="220" height="200" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="60" y="505" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">SQL Server VM 1 (Windows)</text>
  
  <!-- SQL Exporter 1 -->
  <rect x="70" y="520" width="180" height="40" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="80" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">SQL Exporter</text>
  <text x="80" y="550" font-family="Arial, sans-serif" font-size="10" fill="white">Port 9398</text>
  
  <!-- Windows Exporter 1 -->
  <rect x="70" y="570" width="180" height="40" fill="#9c27b0" stroke="#6a1b9a" stroke-width="2" rx="5"/>
  <text x="80" y="585" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Windows Exporter</text>
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="10" fill="white">Port 9182 (VM metrics)</text>
  
  <!-- SQL Server 1 -->
  <rect x="70" y="620" width="180" height="50" fill="#607d8b" stroke="#37474f" stroke-width="2" rx="5"/>
  <text x="80" y="640" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">SQL Server</text>
  <text x="80" y="655" font-family="Arial, sans-serif" font-size="10" fill="white">Port 1433</text>
  
  <!-- SQL Server VM 2 -->
  <rect x="300" y="480" width="220" height="200" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="310" y="505" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">SQL Server VM 2 (Windows)</text>
  
  <!-- SQL Exporter 2 -->
  <rect x="320" y="520" width="180" height="40" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="330" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">SQL Exporter</text>
  <text x="330" y="550" font-family="Arial, sans-serif" font-size="10" fill="white">Port 9398</text>
  
  <!-- Windows Exporter 2 -->
  <rect x="320" y="570" width="180" height="40" fill="#9c27b0" stroke="#6a1b9a" stroke-width="2" rx="5"/>
  <text x="330" y="585" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Windows Exporter</text>
  <text x="330" y="600" font-family="Arial, sans-serif" font-size="10" fill="white">Port 9182 (VM metrics)</text>
  
  <!-- SQL Server 2 -->
  <rect x="320" y="620" width="180" height="50" fill="#607d8b" stroke="#37474f" stroke-width="2" rx="5"/>
  <text x="330" y="640" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">SQL Server</text>
  <text x="330" y="655" font-family="Arial, sans-serif" font-size="10" fill="white">Port 1433</text>
  
  <!-- SQL Server VM 3 -->
  <rect x="550" y="480" width="220" height="200" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="560" y="505" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">SQL Server VM 3 (Windows)</text>
  
  <!-- SQL Exporter 3 -->
  <rect x="570" y="520" width="180" height="40" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="580" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">SQL Exporter</text>
  <text x="580" y="550" font-family="Arial, sans-serif" font-size="10" fill="white">Port 9398</text>
  
  <!-- Windows Exporter 3 -->
  <rect x="570" y="570" width="180" height="40" fill="#9c27b0" stroke="#6a1b9a" stroke-width="2" rx="5"/>
  <text x="580" y="585" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Windows Exporter</text>
  <text x="580" y="600" font-family="Arial, sans-serif" font-size="10" fill="white">Port 9182 (VM metrics)</text>
  
  <!-- SQL Server 3 -->
  <rect x="570" y="620" width="180" height="50" fill="#607d8b" stroke="#37474f" stroke-width="2" rx="5"/>
  <text x="580" y="640" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">SQL Server</text>
  <text x="580" y="655" font-family="Arial, sans-serif" font-size="10" fill="white">Port 1433</text>
  
  <!-- More VMs indicator -->
  <text x="400" y="750" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#666">... and 7 more Windows VMs</text>
  <text x="450" y="770" font-family="Arial, sans-serif" font-size="12" fill="#666">(Each with SQL + Windows Exporters)</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e91e63"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9c27b0"/>
    </marker>
  </defs>
  
  <!-- Browser to Central VM -->
  <line x1="300" y1="330" x2="500" y2="260" stroke="#2196F3" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  
  <!-- Prometheus to SQL Exporters (red lines) -->
  <line x1="520" y1="200" x2="160" y2="480" stroke="#e91e63" stroke-width="2" marker-end="url(#redArrow)"/>
  <line x1="530" y1="200" x2="410" y2="480" stroke="#e91e63" stroke-width="2" marker-end="url(#redArrow)"/>
  <line x1="540" y1="200" x2="660" y2="480" stroke="#e91e63" stroke-width="2" marker-end="url(#redArrow)"/>
  
  <!-- Prometheus to Windows Exporters (purple lines) -->
  <line x1="560" y1="200" x2="160" y2="480" stroke="#9c27b0" stroke-width="2" marker-end="url(#purpleArrow)"/>
  <line x1="570" y1="200" x2="410" y2="480" stroke="#9c27b0" stroke-width="2" marker-end="url(#purpleArrow)"/>
  <line x1="580" y1="200" x2="660" y2="480" stroke="#9c27b0" stroke-width="2" marker-end="url(#purpleArrow)"/>
  
  <!-- Grafana connects to Prometheus -->
  <line x1="650" y1="150" x2="630" y2="150" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Labels -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#e91e63">SQL metrics (9398)</text>
  <text x="200" y="400" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#9c27b0">VM metrics (9182)</text>
  
  <!-- Configuration box -->
  <rect x="850" y="480" width="280" height="180" fill="#fff8e1" stroke="#ffa000" stroke-width="2" rx="8"/>
  <text x="860" y="505" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffa000">Per VM Configuration</text>
  
  <text x="860" y="530" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">SQL Exporter (Port 9398):</text>
  <text x="860" y="545" font-family="Arial, sans-serif" font-size="11" fill="#666">• SQL Server metrics</text>
  <text x="860" y="560" font-family="Arial, sans-serif" font-size="11" fill="#666">• Connection counts</text>
  <text x="860" y="575" font-family="Arial, sans-serif" font-size="11" fill="#666">• Query performance</text>
  
  <text x="860" y="600" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">Windows Exporter (Port 9182):</text>
  <text x="860" y="615" font-family="Arial, sans-serif" font-size="11" fill="#666">• CPU usage</text>
  <text x="860" y="630" font-family="Arial, sans-serif" font-size="11" fill="#666">• Memory usage</text>
  <text x="860" y="645" font-family="Arial, sans-serif" font-size="11" fill="#666">• Disk I/O</text>
  
  <!-- Prometheus config hint -->
  <rect x="850" y="300" width="280" height="120" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="860" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Prometheus Targets</text>
  <text x="860" y="345" font-family="Arial, sans-serif" font-size="11" fill="#666">SQL metrics:</text>
  <text x="860" y="360" font-family="Arial, sans-serif" font-size="10" fill="#666">10.0.1.101-110:9398</text>
  <text x="860" y="380" font-family="Arial, sans-serif" font-size="11" fill="#666">VM metrics:</text>
  <text x="860" y="395" font-family="Arial, sans-serif" font-size="10" fill="#666">10.0.1.101-110:9182</text>
</svg>